name: CI

on:
  pull_request:
    branches:
      - main
      - masterchanges
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

env:
  ORIGINA_PHP: '8.2'

jobs:
  php:
    name: PHP 8.2 quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.ORIGINA_PHP }}
          coverage: none
          tools: composer:v2
      - name: Confirm runtime line
        run: php -v && composer runtime:check --no-interaction
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify locked packages on PHP 8.2
        run: composer check-platform-reqs --no-dev
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock
      - name: Dependency audit
        run: composer audit --no-interaction
      - name: Format check
        run: composer lint:test
      - name: Static analysis
        run: composer analyse
      - name: Tests
        run: composer test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build assets
        run: npm run build

  mysql:
    name: PHP 8.2 / MySQL platform and concurrency
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing-only
          MYSQL_DATABASE: origina_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: origina_test
      DB_USERNAME: root
      DB_PASSWORD: testing-only
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.ORIGINA_PHP }}
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2
      - run: php -v && composer runtime:check --no-interaction
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs --no-dev
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test
