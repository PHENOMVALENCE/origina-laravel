name: Sync reference assets

on:
  push:
    branches:
      - chore/docs-assets-parity
    paths:
      - .github/workflows/sync-reference-assets.yml

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Laravel target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Next.js reference
        uses: actions/checkout@v4
        with:
          repository: PHENOMVALENCE/origina-next
          ref: main
          path: _reference

      - name: Copy approved repository assets
        run: |
          mkdir -p public/img
          cp -a _reference/public/img/. public/img/
          cp _reference/src/app/favicon.ico public/favicon.ico
          rm -rf _reference

      - name: Commit synced assets as project owner
        run: |
          git config user.name "Valence Mwigani"
          git config user.email "mwiganivalence@gmail.com"
          git add public/img public/favicon.ico
          if git diff --cached --quiet; then
            echo "Assets already synchronized."
            exit 0
          fi
          git commit -m "chore: sync approved reference assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
