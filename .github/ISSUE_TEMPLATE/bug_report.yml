name: Bug report
description: Report a reproducible defect in ORIGINA
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Branch, browser/device, PHP/Node versions if relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs or links. Remove secrets and personal data.
